  <rect x="200" y="224" width="280" height="44" rx="22" fill="#f9f9f9" stroke="#555" stroke-width="1"/>
  <text x="340" y="246" text-anchor="middle" dominant-baseline="central" font-size="13">Crea oggetto Impiegato</text>

  <line x1="340" y1="268" x2="340" y2="296" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

